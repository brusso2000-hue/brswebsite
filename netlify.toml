# Static site: HTML is prebuilt (python3 tools/build.py) and committed. Netlify serves the repo root.
[build]
  publish = "."
  command = "sh tools/netlify-build.sh"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
